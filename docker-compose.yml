services:
  redis:
    image: redis:8-alpine
    container_name: educorelms-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - backend

volumes:
  redis_data:

networks:
  backend:
    driver: bridge